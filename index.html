<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Braverman Personality Type Assessment</title>
<style>
:root{
  --bg:#f7f7f9;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#475569;
  --border:#d7dbe3;
  --shadow:0 6px 18px rgba(15,23,42,.08);
  --u-bg:#eef1f5;
  --u-fg:#334155;
  --f-bg:#d8b200; /* golden yellow */
  --f-fg:#1f2937;
  --t-bg:#0b6b3a; /* dark green */
  --t-fg:#ffffff;
  --focus:#2563eb;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family: ui-sans-serif, system-ui, -apple-system, "SF Pro Text","SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
  background:var(--bg);
  color:var(--text);
  line-height:1.35;
}
a{color:var(--focus); text-decoration:none}
a:hover{text-decoration:underline}
.container{
  max-width:980px;
  margin:0 auto;
  padding:18px 14px 88px;
}
.header{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:14px;
}
.title{
  font-size:28px;
  letter-spacing:-0.02em;
  margin:0;
}
.metaRow{
  display:flex;
  flex-wrap:wrap;
  gap:10px 14px;
  align-items:center;
  color:var(--muted);
  font-size:14px;
}
.pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:6px 10px;
  border:1px solid var(--border);
  border-radius:999px;
  background:var(--card);
  box-shadow:0 1px 0 rgba(15,23,42,.04);
}
.pill strong{color:var(--text)}
.tabs{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.tabBtn{
  border:1px solid var(--border);
  background:var(--card);
  padding:10px 12px;
  border-radius:12px;
  font-weight:600;
  color:var(--text);
  box-shadow:0 1px 0 rgba(15,23,42,.04);
}
.tabBtn[aria-selected="true"]{
  outline:2px solid rgba(37,99,235,.25);
  border-color:rgba(37,99,235,.55);
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:14px;
  margin:14px 0;
}
.cardHeader{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
  margin-bottom:10px;
}
.cardHeader h2{
  margin:0;
  font-size:18px;
}
.cardHeader .sub{
  margin-top:4px;
  color:var(--muted);
  font-size:13px;
}
.groupScore{
  min-width:86px;
  text-align:right;
  color:var(--muted);
  font-weight:700;
}
.divider{
  height:1px;
  background:var(--border);
  margin:10px 0 8px;
}
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:8px;
}
.legendItem{
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 10px;
  border:1px solid var(--border);
  border-radius:999px;
  background:var(--card);
  font-size:13px;
  color:var(--muted);
}
.swatch{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.08)}
.swatch.u{background:var(--u-bg)}
.swatch.f{background:var(--f-bg)}
.swatch.t{background:var(--t-bg)}
.qList{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.qRow{
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px;
  background:linear-gradient(#fff,#fff);
}
.qTop{
  display:flex;
  gap:12px;
  align-items:flex-start;
  justify-content:space-between;
}
.qText{
  font-size:15px;
  margin:0;
  padding-right:8px;
}
.seg{
  display:inline-flex;
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  background:var(--card);
  flex-shrink:0;
}
.seg button{
  border:0;
  background:transparent;
  padding:10px 12px;
  font-weight:700;
  font-size:13px;
  color:var(--muted);
  min-width:44px;
}
.seg button:focus{outline:2px solid rgba(37,99,235,.35); outline-offset:-2px}
.seg button.active.u{background:var(--u-bg); color:var(--u-fg)}
.seg button.active.f{background:var(--f-bg); color:var(--f-fg)}
.seg button.active.t{background:var(--t-bg); color:var(--t-fg)}
.hint{
  margin:0;
  margin-top:8px;
  font-size:12px;
  color:var(--muted);
}
.details summary{
  cursor:pointer;
  font-weight:700;
  color:var(--text);
}
.details .content{
  margin-top:8px;
  color:var(--muted);
  font-size:14px;
}
.resultsGrid{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}
@media (min-width:760px){
  .resultsGrid{grid-template-columns:1fr 1fr}
  .title{font-size:34px}
}
.stickyBar{
  position:fixed;
  left:0; right:0; bottom:0;
  background:rgba(247,247,249,.92);
  backdrop-filter:saturate(180%) blur(12px);
  border-top:1px solid var(--border);
  padding:10px 12px;
}
.stickyInner{
  max-width:980px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.actions{
  display:flex;
  gap:10px;
}
.btn{
  border:1px solid var(--border);
  background:var(--card);
  padding:10px 12px;
  border-radius:12px;
  font-weight:800;
}
.btn.primary{
  border-color:rgba(37,99,235,.55);
  outline:2px solid rgba(37,99,235,.18);
}
.mini{
  font-size:13px;
  color:var(--muted);
  font-weight:700;
}
pre{
  white-space:pre-wrap;
  word-break:break-word;
  background:#f1f5f9;
  border:1px solid var(--border);
  padding:12px;
  border-radius:12px;
  color:#0f172a;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 class="title" id="mainTitle"></h1>
    <div class="metaRow">
      <span class="pill"><strong>Progress:</strong> <span id="progressText">0/0</span></span>
      <span class="pill" id="savedFlag" aria-live="polite"></span>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Sections"></div>
  </div>

  <div class="card" id="instructions">
    <!-- instructions injected -->
  </div>

  <div id="content"></div>
</div>

<div class="stickyBar" role="region" aria-label="Actions">
  <div class="stickyInner">
    <div class="mini" id="stickyProgress">Progress: 0/0</div>
    <div class="actions">
      <button class="btn primary" type="button" id="btnResults">Results</button>
      <button class="btn" type="button" id="btnReset">Reset</button>
    </div>
  </div>
</div>

inty and ensure smooth sailing. GABA dominant people tend to gravitate to careers as administrators, accountants, security officers, nurses, medical technicians, air-traffic controllers, news reporters, EMT’s, meeting planners, bus drivers, and homemakers. No matter what the job, the GABA-natured person is the one who tethers the group, who stays focused on the matter at hand, yet usually defers to the majority. You are the consummate team player, deriving pleasure from fulfilling your obligations and taking care of those you love. You are sensible, settled, and not prone to wide swings of emotion or outbursts of anger. You both relish group activities and cherish one-to-one connections. Making others comfortable makes you happy. Marriage is seen as a long-term haven. You probably believe in traditions and institutions, and enjoy your part in making them work, especially at your place of worship. You look forward to holiday gatherings, and planning for them seems more like play than work. You probably like history books and biographies. Collecting memorabilia and creating scrapbooks may provide hours of entertainment. There are times when you feel you’ve had a strong nurturing effect on others, such as after hosting a holiday dinner. EXCESS GABA Producing too much GABA may ratchet up your nurturing tendencies to the point where you ignore your own needs or end up getting hurt. You may spend too much energy looking for love, and then relying too heavily on you mates. You may look too much to authority figures for advice and continuously craving and following the advice of others.", "Serotonin": "SEROTONIN NATURE Serotonin resynchronizes your brain while you sleep so you wake every morning with a fresh start. If you have a serotonin nature, you are among 17% of the population who really know how to enjoy themselves. Serotonin is associated with delta waves (which are produced in abundance when we sleep) and affects our ability to rest, regenerate, and find security. I const STORAGE_KEY = DATA.meta.storageKey || "braverman_assessment";
const STATE = {
  tab: "part1",
  answers: {} // key -> 'u' | 'f' | 't'
};

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
  setSavedIndicator(true);
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const parsed = JSON.parse(raw);
    if(parsed && typeof parsed === "object"){
      STATE.tab = parsed.tab || STATE.tab;
      STATE.answers = parsed.answers || {};
    }
  }catch(e){}
}
function resetAll(){
  STATE.answers = {};
  saveState();
  renderAll();
}

function setSavedIndicator(on){
  const el = document.getElementById("savedFlag");
  if(!el) return;
  el.textContent = on ? "Saved" : "";
}
let savedTimer=null;
function flashSaved(){
  setSavedIndicator(true);
  if(savedTimer) clearTimeout(savedTimer);
  savedTimer=setTimeout(()=>setSavedIndicator(false), 1200);
}

function keyFor(part, groupId, idx){
  return `${part}:${groupId}:${idx}`;
}

function getGroups(part){
  return part === "part1" ? DATA.part1.groups : DATA.part2.groups;
}

function countAllQuestions(){
  let total=0;
  for(const part of ["part1","part2"]){
    for(const g of getGroups(part)){
      total += (g.items||[]).length;
    }
  }
  return total;
}

function progress(){
  const total = countAllQuestions();
  let answered=0;
  for(const k in STATE.answers){
    if(STATE.answers[k] && STATE.answers[k] !== "u") answered++;
  }
  return {answered, total};
}

function scoreGroup(part, group){
  let s=0;
  (group.items||[]).forEach((_, idx)=>{
    const k=keyFor(part, group.id, idx);
    if(STATE.answers[k]==="t") s++;
  });
  return s;
}

function scoresForPart(part){
  const out = [];
  for(const g of getGroups(part)){
    out.push({id:g.id, title:g.title, score:scoreGroup(part,g)});
  }
  return out;
}

function dominantNature(){
  const a = scoresForPart("part1");
  let max = Math.max(...a.map(x=>x.score), 0);
  const top = a.filter(x=>x.score===max && max>0);
  return {max, top, all:a};
}

function el(tag, attrs={}, ...children){
  const n=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==="class") n.className=v;
    else if(k==="html") n.innerHTML=v;
    else if(k.startsWith("on") && typeof v==="function") n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for(const c of children){
    if(c==null) continue;
    if(typeof c==="string") n.appendChild(document.createTextNode(c));
    else n.appendChild(c);
  }
  return n;
}

function renderHeader(){
  const pr = progress();
  document.getElementById("progressText").textContent = `${pr.answered}/${pr.total}`;
}

function renderTabs(){
  const wrap = document.getElementById("tabs");
  wrap.innerHTML="";
  const mk=(id,label)=>el("button",{
    class:"tabBtn",
    type:"button",
    role:"tab",
    "aria-selected": STATE.tab===id ? "true":"false",
    onclick: ()=>{
      STATE.tab=id;
      saveState();
      renderAll();
      window.scrollTo({top:0, behavior:"smooth"});
    }
  }, label);
  wrap.appendChild(mk("part1","Part 1"));
  wrap.appendChild(mk("part2","Part 2"));
  wrap.appendChild(mk("results","Results"));
}

function renderInstructions(){
  const host=document.getElementById("instructions");
  host.innerHTML="";
  const how = el("details",{class:"details", open:true},
    el("summary",{}, "How to answer"),
    el("div",{class:"content", html: `
      <div><strong>Pick one per statement:</strong></div>
      <ul>
        <li><strong>Unanswered</strong> if you’re unsure or want to skip for now.</li>
        <li><strong>False</strong> if it does not describe you.</li>
        <li><strong>True</strong> if it describes you.</li>
      </ul>
      <div class="legend">
        <div class="legendItem"><span class="swatch u"></span> Unanswered</div>
        <div class="legendItem"><span class="swatch f"></span> False</div>
        <div class="legendItem"><span class="swatch t"></span> True</div>
      </div>
    `})
  );
  host.appendChild(how);

  const extra = el("details",{class:"details"},
    el("summary",{}, "About this test"),
    el("div",{class:"content", html: `<pre>${escapeHtml((DATA.part1.instructions||"").trim())}</pre>`})
  );
  host.appendChild(extra);
}

function escapeHtml(s){
  return String(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function renderPart(part){
  const host=document.getElementById("content");
  host.innerHTML="";
  renderInstructions();

  const groups=getGroups(part);
  for(const g of groups){
    const sc=scoreGroup(part,g);
    const card=el("div",{class:"card"});
    const head=el("div",{class:"cardHeader"});
    const left=el("div",{},
      el("h2",{}, `${g.id}. ${g.title}`),
      el("div",{class:"sub"}, (g.subtitle||"").trim())
    );
    const right=el("div",{class:"groupScore"}, `${sc}/${(g.items||[]).length}`);
    head.appendChild(left); head.appendChild(right);
    card.appendChild(head);
    card.appendChild(el("div",{class:"divider"}));

    const list=el("div",{class:"qList"});
    (g.items||[]).forEach((txt, idx)=>{
      const k=keyFor(part,g.id,idx);
      const val = STATE.answers[k] || "u";

      const seg=el("div",{class:"seg", role:"group", "aria-label":`Answer for statement ${idx+1}`});
      const btn=(code,label)=>el("button",{
        type:"button",
        class: (val===code ? `active ${code}` : ""),
        "data-code":code,
        onclick:()=>{
          STATE.answers[k]=code;
          saveState();
          flashSaved();
          // rerender only this row + header stats
          renderAll(false);
        }
      }, label);

      seg.appendChild(btn("u","—"));
      seg.appendChild(btn("f","F"));
      seg.appendChild(btn("t","T"));

      const row=el("div",{class:"qRow"});
      const top=el("div",{class:"qTop"});
      top.appendChild(el("p",{class:"qText"}, txt));
      top.appendChild(seg);

      row.appendChild(top);
      row.appendChild(el("p",{class:"hint"}, "Tap: — Unanswered, F False, T True"));
      list.appendChild(row);
    });

    card.appendChild(list);
    host.appendChild(card);
  }
}

function renderResults(){
  const host=document.getElementById("content");
  host.innerHTML="";
  renderInstructions();

  const card=el("div",{class:"card"});
  card.appendChild(el("h2",{}, "Scores"));
  card.appendChild(el("div",{class:"divider"}));

  const grid=el("div",{class:"resultsGrid"});

  const block=(title, items, extraHtml="")=>{
    const c=el("div",{class:"card", style:"margin:0; box-shadow:none"});
    c.appendChild(el("h2",{}, title));
    c.appendChild(el("div",{class:"divider"}));
    const ul=el("div",{class:"qList"});
    items.forEach(it=>{
      ul.appendChild(el("div",{class:"qRow"},
        el("div",{class:"qTop"},
          el("p",{class:"qText"}, it.title),
          el("div",{class:"groupScore"}, String(it.score))
        )
      ));
    });
    c.appendChild(ul);
    if(extraHtml){
      c.appendChild(el("div",{class:"divider"}));
      c.appendChild(el("div",{class:"sub", html: extraHtml}));
    }
    return c;
  };

  const p1=scoresForPart("part1");
  const dom=dominantNature();
  let domHtml="";
  if(dom.max===0){
    domHtml = "No dominant type yet (no True answers in Part 1).";
  }else if(dom.top.length===1){
    domHtml = `Dominant: <strong>${dom.top[0].title}</strong> (score ${dom.max}).`;
  }else{
    domHtml = `Tie: <strong>${dom.top.map(x=>x.title).join(", ")}</strong> (score ${dom.max}).`;
  }

  grid.appendChild(block("Part 1 (A) — Dominant nature", p1, domHtml));

  const p2=scoresForPart("part2");
  grid.appendChild(block("Part 2 (B) — Deficiencies", p2, "Severity is interpreted exactly per the original test’s printed scoring tables."));

  card.appendChild(grid);

  // Long descriptions / recommendations
  const details = el("details",{class:"details", open:false},
    el("summary",{}, "See more: descriptions and recommendations"),
    el("div",{class:"content", html: renderLongTextHtml() })
  );
  card.appendChild(el("div",{class:"divider"}));
  card.appendChild(details);

  host.appendChild(card);
}

function renderLongTextHtml(){
  // DATA.longText is an array of sections with title/body in v2.
  const sections = (DATA.longText && Array.isArray(DATA.longText)) ? DATA.longText : [];
  if(!sections.length) return "<div>No additional text found in source data.</div>";
  return sections.map(s=>{
    const t = escapeHtml(s.title||"");
    const b = escapeHtml((s.body||"").trim());
    return `<div style="margin:10px 0 14px">
      <div style="font-weight:800; color: var(--text); margin-bottom:6px">${t}</div>
      <pre>${b}</pre>
    </div>`;
  }).join("");
}

function renderSticky(){
  const pr=progress();
  document.getElementById("stickyProgress").textContent = `Progress: ${pr.answered}/${pr.total}`;
}

function renderAll(scrollPreserve=true){
  renderHeader();
  renderTabs();

  const main=document.getElementById("mainTitle");
  main.textContent = DATA.meta.title || "Assessment";

  const saved = document.getElementById("savedFlag");
  if(saved) saved.textContent = "";

  if(STATE.tab==="part1") renderPart("part1");
  else if(STATE.tab==="part2") renderPart("part2");
  else renderResults();

  renderSticky();
}

function wireButtons(){
  document.getElementById("btnResults").addEventListener("click", ()=>{
    STATE.tab="results"; saveState(); renderAll(); window.scrollTo({top:0, behavior:"smooth"});
  });
  document.getElementById("btnReset").addEventListener("click", ()=>{
    if(confirm("Reset all answers? This clears saved progress.")){
      localStorage.removeItem(STORAGE_KEY);
      STATE.answers={};
      STATE.tab="part1";
      renderAll();
    }
  });
}

loadState();
document.addEventListener("DOMContentLoaded", ()=>{
  wireButtons();
  renderAll();
});

</script>
