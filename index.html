<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Braverman Personality Type Assessment</title>

<style>
:root {
  --bg: #f6f7f9;
  --card: #ffffff;
  --border: #d9dde3;
  --text: #1f2937;
  --muted: #6b7280;
  --true: #14532d;
  --false: #d4af37;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
               Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

header {
  padding: 20px;
}

h1 {
  margin: 0 0 12px 0;
  font-size: 28px;
  font-weight: 700;
}

.nav {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}

.nav button {
  flex: 1;
  padding: 10px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: #fff;
  font-weight: 600;
}

.nav button.active {
  outline: 2px solid #93c5fd;
}

.card {
  background: var(--card);
  border-radius: 16px;
  padding: 16px;
  margin: 12px 16px;
  border: 1px solid var(--border);
}

.section-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 6px;
}

.section-meta {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 12px;
}

.question {
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 10px;
}

.question-text {
  margin-bottom: 10px;
  font-size: 16px;
}

.toggle {
  display: flex;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
}

.toggle button {
  flex: 1;
  padding: 10px 0;
  border: none;
  background: #f9fafb;
  font-weight: 700;
}

.toggle button.true.active {
  background: var(--true);
  color: #fff;
}

.toggle button.false.active {
  background: var(--false);
  color: #000;
}

footer {
  position: sticky;
  bottom: 0;
  background: #fff;
  border-top: 1px solid var(--border);
  padding: 12px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

footer button {
  flex: 1;
  padding: 12px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: #fff;
  font-weight: 700;
}
</style>
</head>

<body>

<header>
  <h1>Braverman Personality Type Assessment</h1>
  <div class="nav">
    <button id="tab-part1" class="active">Part 1</button>
    <button id="tab-part2">Part 2</button>
    <button id="tab-results">Results</button>
  </div>
</header>

<div id="content"></div>

<footer>
  <button onclick="showResults()">Results</button>
  <button onclick="resetAll()">Reset</button>
</footer>

<script>
const STORAGE_KEY = "braverman_v5";

const data = {
  part1: [
    {
      id: "1A",
      title: "1A. Dopamine",
      questions: [
        "I find it easy to process my thoughts.",
        "I am mentally sharp and focused.",
        "I feel motivated to achieve my goals."
      ]
    }
  ],
  part2: []
};

let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function toggle(qid, value) {
  if (state[qid] === value) {
    delete state[qid];
  } else {
    state[qid] = value;
  }
  save();
  render();
}

function renderPart(part) {
  const root = document.getElementById("content");
  root.innerHTML = "";

  part.forEach(section => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="section-title">${section.title}</div>
      <div class="section-meta">${countAnswered(section)} / ${section.questions.length}</div>
    `;

    section.questions.forEach((text, idx) => {
      const qid = section.id + "_" + idx;
      const q = document.createElement("div");
      q.className = "question";

      q.innerHTML = `
        <div class="question-text">${text}</div>
        <div class="toggle">
          <button class="true ${state[qid]==='T'?'active':''}" onclick="toggle('${qid}','T')">T</button>
          <button class="false ${state[qid]==='F'?'active':''}" onclick="toggle('${qid}','F')">F</button>
        </div>
      `;

      card.appendChild(q);
    });

    root.appendChild(card);
  });
}

function countAnswered(section) {
  return section.questions.filter((_, i) =>
    state[section.id + "_" + i]
  ).length;
}

function showResults() {
  const root = document.getElementById("content");
  root.innerHTML = "<div class='card'><h2>Results</h2><p>Scoring summary will appear here.</p></div>";
}

function resetAll() {
  if (confirm("Clear all answers?")) {
    state = {};
    save();
    render();
  }
}

function render() {
  renderPart(data.part1);
}

render();
</script>

</body>
</html>
